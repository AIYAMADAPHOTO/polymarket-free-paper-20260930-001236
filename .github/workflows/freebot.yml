name: Polymarket Free 48h Paper Test

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: polymarket-free-48h-paper-test
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: PAPER
      STARTING_BALANCE_USD: '50.00'
      FREEBOT_DATA_DIR: freebot-data-v2
      FREEBOT_DURATION_HOURS: '48'
      FREE_SCAN_LIMIT: '1000'
      FREE_PAGE_SIZE: '100'
      FREE_SCAN_INTERVAL_SECONDS: '600'
      FREE_AI_CANDIDATE_LIMIT: '40'
      FREE_EVIDENCE_CANDIDATE_LIMIT: '8'
      FREE_EVIDENCE_CACHE_SECONDS: '1800'
      FREE_EVIDENCE_ITEMS_PER_MARKET: '6'
      FREE_EVIDENCE_TIMEOUT_SECONDS: '12'
      FREE_MIN_EDGE: '0.08'
      FREE_MAX_POSITION_FRACTION: '0.06'
      FREE_MAX_EXPOSURE_FRACTION: '0.30'
      FREE_MAX_POSITIONS: '5'
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_USE_GOOGLE_SEARCH: 'false'
      GEMINI_MAX_CALLS_PER_DAY: '150'
      GEMINI_BILLING_DISABLED_CONFIRMED: 'YES'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python info
        run: python3 --version

      - name: Zero-cost preflight
        run: python3 freebot.py preflight --data "$FREEBOT_DATA_DIR"

      - name: Run one paper cycle
        run: python3 freebot.py once --data "$FREEBOT_DATA_DIR"

      - name: Build run summary
        if: always()
        run: python3 scripts/github_summary.py --data "$FREEBOT_DATA_DIR"

      - name: Commit paper state back to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$FREEBOT_DATA_DIR" ]; then
            echo "No state directory to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$FREEBOT_DATA_DIR"
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "paper-test-v2: persist cycle ${GITHUB_RUN_NUMBER}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Queue next 10-minute cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/github_is_complete.py --data "$FREEBOT_DATA_DIR"; then
            echo "48h experiment completed. No further cycle will be queued."
            exit 0
          fi
          echo "Waiting 10 minutes before queuing the next cycle..."
          sleep 600
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/freebot.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Next cycle queued."
